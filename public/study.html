# Staff Frontend System Design Self-Study Plan

A 2-week, study-only prep plan for the **Staff Software Engineer - Frontend** staff frontend role. No new code. The running case study is the **AI Document Intelligence Console** (this repo). The interview surface is the **Vision** document-intelligence product: 100-page PDFs, bounding-box overlays, human-in-the-loop review, schema designers, and eval dashboards.

The lower **Frontend Engineer, Vision** JD is the concrete instance of the abstract Staff JD. Staff altitude is architecture, standards, and influence. The board prompt is almost certainly the Vision surface.

- **Timeline:** 2 weeks intensive (~4-6 hrs/day).
- **Mode:** study + mock interviews only.
- **Spine:** Master.dev [Front-End System Design](https://master.dev/courses/frontend-system-design/) (Evgenii Ray, 4h37m), then Vision-domain drills.
- **Supplements:** TanStack Virtual, TanStack Pacer, the document intelligence API, Temporal, Fanout (async + reliability chapters only).

## 0. Panel and interviewer context

The frontend org is nascent. The team is hiring the Staff Frontend role and the Vision frontend owner at the same time. Most of the panel is backend or applied AI. Make frontend depth legible in systems terms: memory, latency, contracts, failure modes. Framework jargon is not the signal.

Likely panel:

- **Sunny Shah, Head of Engineering.** Backend, data platforms, DevOps (ex-IndMoney, ex-Goibibo). Leadership and bar-raiser round: ownership, root-cause bias, influence without authority. He has said he interviews personally.
- **Vision applied-AI and backend engineers.** Founding and early engineers are ML and applied-AI heavy. They probe document-intelligence domain and API contracts, not React trivia. Backend stack on the Vision JD: Go, Python, Temporal, REST, Kubernetes, PostgreSQL, Redis, object storage, OpenTelemetry.
- **Possible founder pass** for altitude (Pratyush Kumar on the AI/systems side, Vivek Raghavan on India-scale product).

What they are hiring you to own, from the Vision JD: document viewers with field-level grounding, review and correction workflows, extraction schema builders, evaluation dashboards, and the developer console customers use to run pipelines. You shape API contracts with backend engineers. You set the frontend standard for a team that does not have one yet.

**Drill:** take one decision (canvas overlay vs DOM boxes, polling vs SSE, optimistic field edit) and explain it in four sentences a backend engineer would accept: the constraint, the choice, the failure mode, what you revisit at 10x.

---

## 1. How to answer a frontend system design question

A repeatable 9-step frame. Spend the first ~5 minutes on steps 1-2. Interviewers grade you on driving the conversation, naming trade-offs, and closing loops.

1. **Clarify & scope.** Restate the prompt. Split functional vs non-functional requirements. Ask: who are the users (reviewer, schema author, eval owner, enterprise operator), what's the primary flow, what's out of scope. Write requirements on the board.
2. **Constraints & scale.** Numbers: page count (60-100+), boxes per page, concurrent reviewers, languages/scripts (23, including RTL), scan quality, latency to first page, time-to-partial-result. These numbers justify every later decision.
3. **Data model & API.** Entities: document, page, job, field, bounding box, schema version, correction, eval slice. The public document contract is a job: submit, poll status, fetch results. Say that out loud, then say where you would add streaming.
4. **Component & state architecture.** Component tree and state layers: server cache, client/UI state, URL state, ephemeral. Name why a component re-renders. Show data flow from job status to overlay to field list.
5. **Real-time / async.** How updates arrive (poll cadence, then SSE if the contract grows), ordering, reconnection, backpressure. Partial pages render as they complete. Corrections are optimistic and reconcile.
6. **Failure & partial results.** Error, timeout, degraded OCR, offline, retry. Idempotency on corrections. "Stale but usable" while a page is still processing.
7. **Performance.** Virtualize pages. Choose DOM, SVG, or canvas for boxes. Lazy-decode pages. Tie each choice to memory, INP, and first-page latency.
8. **Observability & rollout.** Accuracy by field and document type, latency and cost, correlation ids, feature flags. Eval dashboards are part of the product, not an afterthought.
9. **Trade-offs & follow-ups.** The 2-3 decisions that mattered, what changes at 10x, what you left out (media/dubbing is staff-adjacent, not this team's daily surface).

**Time-box (45 min):** 5 clarify/scale, 10 data+API+components, 10 real-time+failure, 10 performance (rendering), 5 observability/rollout, 5 wrap-up.

**Panel translation:** after each decision, one sentence of systems cost. Example: "Canvas for boxes because 2,000 DOM nodes per page forces layout; the page bitmap stays on a worker; hit-testing is a spatial index, not the DOM."

## 3. Core mental-model cheat sheets

### 3.1 Overlay rendering chooser (DOM vs SVG vs Canvas)

Boxes sit on top of a rendered page. Page count and box count decide the layer.

| Layer | Use when | Cost |
| --- | --- | --- |
| DOM (absolutely positioned divs) | Tens of boxes, need text selection, CSS, a11y for free | Layout/paint per box; thousands of nodes jank scroll and zoom |
| SVG | Hundreds of boxes, zoom/pan as a transform, crisp vectors | One paint layer; hit-testing via elements; still heavy past a few thousand nodes |
| Canvas | Thousands of boxes, confidence heat, scribble/annotation | One bitmap; you own hit-testing, dirty rects, and devicePixelRatio; no DOM a11y unless you mirror a focus target |

Rule: render the **page** with PDF.js (worker, lazy, one or two pages decoded). Draw **boxes** in the cheapest layer that still supports hit-testing and keyboard focus. Keep a spatial index (page -> boxes) so a click maps to a field without walking the DOM. Confidence is label + color, never color alone. On zoom, transform the overlay with the page (GPU) instead of reflowing every box.

Tie-in: this repo draws overlays in the DOM because the review set is small. At 100 pages x dozens of boxes, say you would move boxes to canvas/SVG and keep one DOM focus target for the active field.

### 3.2 Transport chooser, with the production contract first

| Option | Direction | Reconnect | Use when | Cost |
| --- | --- | --- | --- | --- |
| **Polling** | client pull | trivial (re-poll `job_id`) | their Document AI API today; job status every 1-2s | wasted requests if naive; fix with backoff and `Retry-After` |
| Long polling | client pull, held | manual | gateway in front of Temporal when you cannot stream yet | connection churn |
| **SSE** | server to client | `Last-Event-ID` | receive-only progress once you own the gateway | one-way; HTTP/1.1 ~6 connections |
| **WebSocket** | both ways | you build it | reviewer cursors, collaborative schema edit | sticky sessions, fan-out |

**Say this:** The production API is polling. This project uses SSE because the event log is the source of truth and the client only receives; cancel/retry are POST. On their stack I would poll `get_status` with jittered backoff, render partial pages as soon as a page result exists, and propose an SSE (or a single multiplexed stream) only when poll fan-out or latency-to-first-box becomes the bottleneck. Control actions stay request/response.

Pacer mapping: throttle or rate-limit the poll loop; debounce field saves; batch corrections.

### 3.3 Event-log / async job model (Temporal on their side)

- **Workflow = source of truth on the server.** Temporal runs decomposition, retries, verification, ensembling. The UI projects workflow state: queued, running, partial, completed, failed.
- **Poll returns a snapshot; a log returns a diff.** If you only have status snapshots, replace local progress from the snapshot (last snapshot wins). If you own an event log, replay from the last id. Do not mix the two without saying which one is authoritative.
- **Partial results:** render completed pages and fields; mark the rest pending. `partially_completed` is a first-class UI state.
- **Retries:** show attempt, keep prior output for audit, backoff with jitter. Idempotency key on submit so a double-click does not start two workflows.
- **Progress:** derive processed/total from page counts in the snapshot, not a separate client counter.
- **Corrections loop:** an approved edit is a new fact (field version), not a mutation of model output. It feeds the eval set. Optimistic UI, then reconcile on the write response.

### 3.4 TanStack Pacer patterns

[TanStack Pacer](https://tanstack.com/pacer) is the vocabulary for timing on this UI.

| Pattern | On this surface |
| --- | --- |
| Debounce (trailing) | Field edit save; schema-designer "test against sample" |
| Throttle | Scroll-linked overlay reposition; zoom slider |
| Rate limit (sliding window) | Poll `get_status`; cap correction writes per reviewer |
| Queue (concurrency limit) | Serialise saves so an older keystroke cannot overwrite a newer one; priority queue for approve/reject |
| Batch | Flush a review session's corrections as one eval write |
| Async retry / abort | Cancel an in-flight poll or schema test when the user navigates away |

### 3.5 State layers

- **Server cache** (TanStack Query or equivalent): job snapshot, page results, schema versions. Invalidate on terminal status or on correction write.
- **Client/UI state:** review machine (selected field, pending edit, approve/reject), optimistic overlay.
- **URL state:** job id, page, selected field. Deep-link a reviewer to page 40, field `gstin`.
- **Ephemeral:** hover box, focus ring, in-progress keystrokes.
- Model review as a **state machine** so you cannot approve a field that is still streaming. Reconcile optimistic edits with `version` / `updated_at`.

### 3.6 Performance levers

- **First page (LCP-equivalent):** stream the file, decode page 1 on a PDF.js worker, do not wait for page 100.
- **INP:** keep box hit-testing off the main thread when possible; debounce saves; virtualize the page list and the review queue with [TanStack Virtual](https://tanstack.com/virtual) (measured sizes, recycle rows).
- **Memory:** decode a window of pages; evict bitmaps outside the window; one overlay layer, not one canvas per box.
- **CLS:** reserve page aspect ratio before the bitmap arrives.
- **Network:** HTTP/2 for parallel page-result fetches; in-flight dedupe; do not re-download a page you already rendered.

### 3.7 Rendering pipeline (course spine, still required)

`DOM + CSSOM -> style -> layout -> paint -> composite`. Transform/opacity (zoom/pan the page) can stay on the compositor. Width/top/left on every box forces layout. Batch writes. Prefer a single transformed overlay.

### 3.8 Observability

- Product metrics: accuracy by field and document type, correction rate, time-to-first-box, time-to-approve, cost per document.
- Engineering metrics: poll latency, worker decode time, long tasks, memory of the PDF worker.
- Traces: `request_id`, `job_id`, `document_id` from this repo, extended to a real OTel backend. SLI example: "field box visible within 2s of the page result landing."

---

## 4. The 14-day schedule

**Week 1 = course spine, retargeted at the Vision surface.** Each day: watch, connect to this repo and to the Vision JD, then drill out loud for a backend-leaning interviewer.

- **Day 1 - Core fundamentals.** Course: box model, reflow, composition layers, browser rendering. Tie-in: zoom/pan of a PDF page must be transform, not layout. Drill: one CSS change through style -> layout -> paint -> composite, and when the overlay should be canvas instead.
- **Day 2 - DOM and observers.** Course: DOM cost, Intersection/Resize observers. Tie-in: which page is visible drives PDF.js decode and which boxes mount. Drill: observer-driven page window plus an overlay that stays aligned on resize.
- **Day 3 - Virtualization + canvas overlays.** Course: virtualization, pooling, recycling. Read TanStack Virtual (measured size, window scroll). Tie-in: `DocumentViewer`. Drill: 100-page PDF, lazy decode, canvas boxes, spatial hit-test, memory ceiling. This is the highest-priority technical day.
- **Day 4 - State, polling, and Pacer.** Course: networking (polling, SSE, WebSockets, REST). Add Pacer: debounce, throttle, rate limit, queue, batch. Tie-in: `useJobStream` is your SSE design; the production API is poll + Temporal. Drill: defend polling first, name the upgrade to SSE, debounce a field save, batch corrections.
- **Day 5 - Web performance.** Course: LCP/INP/CLS, bundling. Tie-in: PDF.js worker off the main bundle, virtualized review queue. Drill: perf budget for first page and for scroll across a 100-page contract.
- **Day 6 - Schema designer + eval dashboard.** Not in the course. Drill both: (1) define/test/version an extraction schema, Zod-shaped, bad states unrepresentable; (2) dashboard of accuracy by field and doc type, latency, cost, model comparison. Tie-in: `src/jobs/types.ts` and `src/telemetry`.
- **Day 7 - Vision console mock.** Full 45-minute mock: upload -> Temporal job -> poll -> partial pages -> boxes -> keyboard review -> correction back into eval. Self-score against Section 1. Record the four-sentence panel translation for your three biggest decisions.

**Week 2 = staff altitude on the same surface, plus one adjacency day.**

- **Day 8 - Long-running jobs.** Fanout ch.08 (task queue vs log, queue lag, DAG, fan-out) and ch.02 (retries, timeouts, idempotency). Case: Stripe idempotency. Map onto Temporal workflows and this repo's `attempt` stamp. Drill: partial failure UI for a 60-page GST pack.
- **Day 9 - Indic documents + i18n.** 23 languages, RTL (Urdu, Sindhi, Kashmiri), complex shaping, reading order vs visual order for boxes. Tie-in: `ReviewList`. Drill: the same console with mixed Devanagari and Urdu on one page.
- **Day 10 - Review loop and API contracts.** Keyboard queue, approve/reject, optimistic edit, idempotent write, version conflict when re-extraction lands. You propose the request/response shapes to a Go/Python backend. Drill: whiteboard the correction API.
- **Day 11 - Observability.** Fanout ch.14 (observability, SLOs, incidents). OTel, source maps, RUM. Tie-in: correlation ids. Drill: an eval dashboard a researcher and an on-call engineer both use.
- **Day 12 - Frontend standard.** Design system, typing, testing, a11y, flags, CI. You are setting this for a team that has no frontend owner yet. Drill: what you standardize in the first 30 days, and what you leave local.
- **Day 13 - Scale trade-offs.** Horizontal poll/SSE gateways, serverless vs durable workers, multi-tenant customer console. This project's honest limit: single-process SQLite. Cases: Discord fan-out, Instagram feed only as contrast. Drill: 10x the Vision console.

## 5. Mock question bank

Run Section 1 on each. Vision prompts come first. The last two are staff breadth so you are not surprised.

1. **Design the document review console.** Upload -> job -> poll status -> partial pages -> bounding boxes with confidence -> side-by-side field list -> approve/reject -> export. Non-functional: 100-page scans, 23 languages, restart, partial OCR. Trade-offs: poll vs SSE, DOM vs canvas boxes, event-log projection vs status snapshots.
2. **100-page PDF with live boxes as each page completes.** PDF.js worker, virtualized pages, overlay layer, spatial index, memory eviction, zoom as transform. Confidence is label + color.
3. **Source-to-extraction linking.** Click a field, scroll the viewer to its page, highlight the box. Click a box, focus the field. URL holds page + field id. Coordinates: PDF space vs viewport vs zoom.
4. **Keyboard review queue.** J/K or arrows move fields, edit in place, approve/reject, undo. Optimistic update, version conflict if a re-extraction arrives, debounce saves, batch the session into the eval loop.
5. **Extraction schema designer.** User defines fields (name, type, required, description), tests against a sample doc, versions the schema (`config_id`). Type system makes illegal schemas unrepresentable. Old jobs keep the schema version they ran with.
6. **Eval and cost dashboard.** Accuracy by field and document type, correction rate, latency, cost per page, model A vs model B. Dense table virtualized. Drill-through to the source box.
7. **Polling a Temporal workflow from the browser.** `job_id`, poll cadence, backoff, terminal states, idempotent submit, what the UI shows when the workflow is retrying activity 3 of 7. When you would ask backend for SSE.
8. **Partial failures on a multi-page pack.** Some pages done, one page failed OCR, user retries that page only. `attempt` visible. Stale-but-usable elsewhere. Idempotency so retry does not duplicate fields.
9. **API contract you shape.** Propose the status payload and the correction write to a Go/Python teammate. Include page-level partials, field versions, and error codes. Say what you refuse to poll in a tight loop.
10. **Resumable large-file upload into object storage.** Chunks, content hash, presigned URLs, concurrency cap, progress. Then hand off to the same job model.
11. **Staff breadth: shared component standard.** Tokens, primitives, versioning, a11y, Storybook-as-contract, adoption in a team you are the first frontend owner of.
12. **Staff breadth: dubbing review UI (adjacency).** Waveform, transcript segments, per-segment regenerate as a long-running job, A/V sync. Reuse the job/partial-result model. Do not let this crowd out prompts 1-10.

## 6. Project narrative one-pager

Whiteboard story for "tell me about a system you built." About 3 minutes. Then bridge to their stack.

**What:** An operator console for long-running document processing. Drop a document, a job processes it, the UI shows live status, the operator reviews extracted fields over a virtualized viewer.

**Architecture:**

```mermaid
flowchart LR
  Upload[Chunked resumable upload] --> Job[Job created]
  Job --> Log[Append-only event log]
  Log --> SSE[SSE events route]
  SSE --> Hook[useJobStream hook]
  Hook --> UI[JobConsole plus viewer plus review]
  UI -->|cancel or retry POST| Control[Control handlers]
  Control --> Log
  Log --> Store[(Durable SQLite store)]
```

**Five decisions:**

1. **Event log is the source of truth.** The SSE stream is a disposable cursor. Reconnect replays from `Last-Event-ID`.
2. **SSE here, polling on the production API.** This client only receives, so SSE fits. Their Document AI API is submit + poll `get_status` + fetch results, with Temporal running the workflow. I would ship polling against that contract and propose a stream when poll latency or fan-out hurts.
3. **Durable store** so jobs, events, and reviews survive restart, with an honest single-process limit.
4. **Virtualized viewer** so 100-page docs do not load every page. At their box density I would move overlays from DOM nodes to canvas or SVG and keep a spatial index.
5. **Partial results and retries.** `attempt` on queued work, `partially_completed`, progress derived from replayed events. Corrections should be versioned facts that feed eval, not silent overwrites.

**At 10x:** shard the gateway, multiplex per-job streams, move durability off one process, real OTel, Indic layout and RTL in the overlay, schema versions pinned to jobs.

**Honest limits:** single-process durability; mock extraction by default; overlays are DOM, not canvas; no schema designer; no eval dashboard; no media pipeline.

## 7. Gap-topic primers

### 7.1 Canvas, SVG, and PDF.js (highest-priority gap)

- PDF.js decodes a page to a canvas (or an optional text layer) on a worker. Viewport = scale x rotation x page box. Device pixel ratio must be set or the bitmap is blurry and wastes memory.
- Overlay coordinates are in PDF space. Convert with the same viewport transform the page used. On zoom, update the transform; do not rebuild every box's layout.
- Hit-testing on canvas: invert the transform, query a spatial index (grid or R-tree per page), map the hit to a field id. Keep a DOM node only for the focused field so keyboard and screen readers still work.
- Memory: retain bitmaps for the visible window plus one page of overscan. Drop the rest. Cancel decode tasks for pages that scrolled away.
- TanStack Virtual: the page list and the field list are windowed. Measured row heights matter because pages have different aspect ratios.

### 7.2 Schema designer and eval loop

- A schema is a versioned contract: field key, type, required, hint text, maybe an enum. Store `schema_version` or `config_id` on the job. Re-running extraction with a new version must not rewrite old results in place.
- "Bad states unrepresentable": Zod (or equivalent) on the client and a matching server check. A number field cannot be saved as free text. A required field cannot be omitted from a test run.
- Test-against-sample: run Extract on one document, show values beside the schema, let the author revise, then publish a version.
- Eval: a correction is labeled data. Dashboard slices accuracy by field and document type (PAN, GST, contract), plus latency and cost. Model comparison is the same slice on two runs, not a separate app.
- Human-in-the-loop: approve is not "make the UI green." It writes a reviewed value and a link back to the source box so the eval set stays grounded.

### 7.3 Polling, Temporal, and when to stream

- Temporal: workflow (the document job) and activities (per page OCR, verify, ensemble). The UI should understand running, retrying, and partial, not a single spinner.
- Poll design: start at ~1s, back off while the job is quiet, stop on terminal status, honor `Retry-After`, abort on unmount. Rate-limit so 50 open jobs do not stampede.
- Upgrade to SSE when many clients watch one job, or when time-to-first-box must be sub-second and poll jitter dominates. The event payload should match the poll snapshot so the client has one reducer.
- Idempotent submit: client-generated key. Retries and double-clicks return the same `job_id`.

### 7.4 Indic scripts (product-specific)

- 23 languages, including RTL (Urdu, Sindhi, Kashmiri). Logical CSS properties. Font subsetting per script. Bidi in mixed lines.
- Boxes follow reading order, which may not be visual order. Do not assume left-to-right field tab order.
- Test with real samples: Devanagari conjuncts, Tamil, Urdu nastaliq. Shaping bugs show up as overflow and wrong hit targets.

### 7.5 Media / audio (staff adjacency, one sitting)

- Container vs codec. HLS/DASH and ABR. MSE vs WebCodecs vs WebRTC. A/V sync via presentation timestamps.
- Dubbing UI reuses the job model: per-segment regenerate, partial results, waveform from decoded PCM. Say the analogy, then return to documents.
- Do not spend a full day here unless the interviewer opens the Staff JD's media line.

### 7.6 Explaining frontend choices to a backend panel

Template: constraint (numbers) -> option you rejected and why -> option you chose -> failure mode -> 10x revisit. Example: "2,000 boxes. DOM layout was the cost. Canvas plus a spatial index. Failure mode is hit-testing drift if the viewport transform diverges from PDF.js. At 10x I would move hit-testing to a worker."

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
(function () {
  var root = document.documentElement;
  var content = document.getElementById('content');
  var tocEl = document.getElementById('toc');
  var mermaidSources = [];

  // ---- theme ----
  var saved = localStorage.getItem('study-theme');
  if (saved) root.setAttribute('data-theme', saved);
  function currentTheme() { return root.getAttribute('data-theme') || 'dark'; }

  function slug(text) {
    return text.toLowerCase().trim()
      .replace(/[^\w\s-]/g, '')
      .replace(/\s/g, '-');
  }

  // ---- render markdown ----
  var md = document.getElementById('source').textContent;
  if (window.marked) {
    marked.setOptions({ gfm: true, breaks: false, headerIds: false, mangle: false });
    content.innerHTML = marked.parse(md);
  } else {
    content.innerHTML = '<p>Failed to load renderer. View the source markdown at <code>docs/interview-prep/frontend-system-design.md</code>.</p>';
    return;
  }

  // ---- add heading ids ----
  var used = {};
  content.querySelectorAll('h1, h2, h3, h4').forEach(function (h) {
    var id = slug(h.textContent);
    if (used[id] != null) { used[id]++; id = id + '-' + used[id]; } else { used[id] = 0; }
    h.id = id;
  });

  // ---- wrap tables for horizontal scroll ----
  content.querySelectorAll('table').forEach(function (t) {
    var wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });

  // ---- convert mermaid code blocks to mermaid divs ----
  content.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.dataset.src = code.textContent;
    div.textContent = code.textContent;
    mermaidSources.push(div);
    code.parentNode.replaceWith(div);
  });

  function renderMermaid() {
    if (!window.mermaid) return;
    var light = currentTheme() === 'light';
    var theme = light ? 'default' : 'base';
    var themeVariables = light ? undefined : {
      darkMode: true,
      background: '#2c2a27',
      primaryColor: '#3a3632',
      primaryTextColor: '#efe9df',
      primaryBorderColor: '#6a6258',
      secondaryColor: '#33302c',
      tertiaryColor: '#2c2a27',
      lineColor: '#aea79a',
      textColor: '#efe9df',
      fontFamily: '-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif'
    };
    try {
      mermaid.initialize({ startOnLoad: false, theme: theme, themeVariables: themeVariables, securityLevel: 'loose' });
      mermaidSources.forEach(function (el) {
        el.removeAttribute('data-processed');
        el.innerHTML = el.dataset.src;
      });
      mermaid.run({ nodes: mermaidSources });
    } catch (e) { /* diagram optional */ }
  }
  renderMermaid();

  // ---- build sidebar TOC from h2/h3 ----
  var frag = document.createDocumentFragment();
  content.querySelectorAll('h2, h3').forEach(function (h) {
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';
    a.dataset.target = h.id;
    frag.appendChild(a);
  });
  tocEl.appendChild(frag);

  // ---- scrollspy ----
  var links = Array.prototype.slice.call(tocEl.querySelectorAll('a'));
  var heads = links.map(function (a) { return document.getElementById(a.dataset.target); });
  function onScroll() {
    var top = window.scrollY + 90;
    var idx = 0;
    for (var i = 0; i < heads.length; i++) {
      if (heads[i] && heads[i].offsetTop <= top) idx = i;
    }
    links.forEach(function (a, i) { a.classList.toggle('active', i === idx); });
    var docH = document.documentElement.scrollHeight - window.innerHeight;
    document.getElementById('progress').style.width = (docH > 0 ? (window.scrollY / docH) * 100 : 0) + '%';
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // ---- controls ----
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = currentTheme() === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    localStorage.setItem('study-theme', next);
    renderMermaid();
  });
  document.getElementById('printBtn').addEventListener('click', function () { window.print(); });

  var toggle = document.getElementById('tocToggle');
  toggle.addEventListener('click', function () { document.body.classList.toggle('toc-open'); });
  tocEl.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') document.body.classList.remove('toc-open');
  });
})();
</script>
